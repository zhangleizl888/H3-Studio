[alembic]
script_location = alembic
prepend_sys_path = .
# Connection URL is set by alembic/env.py from apps/api/.env.
# Do not hard-code it here: pgserver picks a new port on every boot.
# NOTE: keep this file ASCII only. Alembic reads it with configparser using
# the platform locale encoding (GBK on this machine), so any non-ASCII comment
# raises UnicodeDecodeError before you get to the migration.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
